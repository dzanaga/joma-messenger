[package]
name = "joma-desk"
description = "Joma desktop share: gliff's Hyprland streaming pipeline between Jami peers"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
gliff-proto.workspace = true
gliff-transport.workspace = true
gliff-vk.workspace = true
gliff-sw.workspace = true
gliff-va.workspace = true
hypr-capture.workspace = true
hypr-ipc.workspace = true
# The ink overlay: a layer-shell surface of our own on the shared screen.
hypr-wl = { git = "https://github.com/omacom/gliff", rev = "58c742452ded3f10a2ce61f60eb4845f18205e29" }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop = "0.14"
drm-fourcc = "2"
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
futures = "0.3"

[dev-dependencies]
tracing-subscriber.workspace = true
