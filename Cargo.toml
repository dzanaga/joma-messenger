[workspace]
resolver = "2"
members = ["crates/hypr-capture", "crates/joma-jami", "crates/joma-theme", "crates/joma-desk", "crates/joma-quick", "crates/joma"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
version = "0.4.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
# gliff's streaming pipeline, used as libraries (pinned to the reviewed checkout).
gliff-proto = { git = "https://github.com/omacom/gliff", rev = "58c742452ded3f10a2ce61f60eb4845f18205e29" }
gliff-transport = { git = "https://github.com/omacom/gliff", rev = "58c742452ded3f10a2ce61f60eb4845f18205e29" }
gliff-vk = { git = "https://github.com/omacom/gliff", rev = "58c742452ded3f10a2ce61f60eb4845f18205e29" }
gliff-sw = { git = "https://github.com/omacom/gliff", rev = "58c742452ded3f10a2ce61f60eb4845f18205e29" }
gliff-va = { git = "https://github.com/omacom/gliff", rev = "58c742452ded3f10a2ce61f60eb4845f18205e29" }
hypr-capture = { path = "crates/hypr-capture" }
hypr-ipc = { git = "https://github.com/omacom/gliff", rev = "58c742452ded3f10a2ce61f60eb4845f18205e29" }

[profile.release]
lto = "thin"
debug = "line-tables-only"

# The software codec and its pixel kernels are unusable unoptimised; keep them fast in
# debug builds too (the rest of the tree stays at opt-level 0).
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.gliff-sw]
opt-level = 3
[profile.dev.package.gliff-proto]
opt-level = 3
[profile.dev.package.hypr-capture]
opt-level = 3
[profile.dev.package.joma-desk]
opt-level = 3
